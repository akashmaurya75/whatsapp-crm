# Used by docker-compose. Terminate TLS in front of this (load balancer or host nginx).
server {
    listen 80;
    root /var/www/whatsapp-crm/public;
    client_max_body_size 2m;
    server_tokens off;

    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri /index.php$is_args$args; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/whatsapp-crm/public/index.php;
        fastcgi_pass app:9000;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
