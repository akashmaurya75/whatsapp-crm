# /etc/nginx/sites-available/whatsapp-crm
# Only public/ is web-exposed. Replace crm.example.com and the PHP-FPM socket path.

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.example.com;

    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/whatsapp-crm/public;
    index index.php;
    client_max_body_size 2m;
    server_tokens off;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 30s;
    }

    # Never execute or serve anything else.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
