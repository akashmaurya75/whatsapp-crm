# Local/single-host deployment. Put real secrets in .env (see .env.example), never in this file.
# First run:  docker compose up -d && docker compose exec app php bin/console migrate && docker compose exec app php bin/console seed
#             docker compose exec app php bin/console create-admin
services:
  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      LOG_FILE: stderr
    volumes:
      - storage:/var/www/whatsapp-crm/storage
    depends_on: [db]
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      LOG_FILE: stderr
    command: ["php", "bin/console", "queue:work", "--max-jobs=1000"]
    volumes:
      - storage:/var/www/whatsapp-crm/storage
    depends_on: [db]
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      LOG_FILE: stderr
    command: ["sh", "-c", "while true; do php bin/console schedule:run; sleep 60; done"]
    depends_on: [db]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./public:/var/www/whatsapp-crm/public:ro
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped

volumes:
  storage:
  dbdata:
